# meta: {"name": "DoubleEnsemble", "group": "树模型", "description": "双重集成（样本+特征加权）的树模型，官方 Alpha158 基准中收益表现最好之一。", "requires_gpu": false, "params_schema": {"start_date": {"label": "数据开始日期", "type": "date", "default": "2008-01-01", "tip": "特征计算与训练使用的最早日期"}, "end_date": {"label": "数据结束日期", "type": "date", "default": "2020-08-01", "tip": "回测截止日期，之后的数据不使用"}, "market": {"label": "股票池", "type": "select", "options": ["csi300", "csi500"], "default": "csi300", "tip": "csi300=沪深300，csi500=中证500"}, "account": {"label": "初始资金", "type": "number", "default": 100000000, "tip": "回测账户的初始金额（元）"}, "topk": {"label": "持仓数量", "type": "number", "default": 50, "tip": "每次持有评分最高的前 N 只股票"}, "n_drop": {"label": "每期卖出数", "type": "number", "default": 5, "tip": "每次调仓卖出排名靠后的几只股票"}}}
# ============================================================
# 模板说明：占位符由后端渲染时替换，请勿直接运行本文件
# 占位符列表：{{START_DATE}} {{TRAIN_END}} {{TEST_START}} {{END_DATE}}
#             {{FIT_START}} {{FIT_END}} {{MARKET}} {{ACCOUNT}} {{TOPK}} {{N_DROP}}
# ============================================================
qlib_init:
    provider_uri: "{{DATA_DIR}}/cn_data"
    region: cn
market: &market {{MARKET}}
benchmark: &benchmark SH000300
data_handler_config: &data_handler_config
    start_time: {{START_DATE}}
    end_time: {{END_DATE}}
    fit_start_time: {{START_DATE}}
    fit_end_time: {{FIT_END}}
    instruments: *market
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: {{TOPK}}
            n_drop: {{N_DROP}}
    backtest:
        start_time: {{TEST_START}}
        end_time: {{END_DATE}}
        account: {{ACCOUNT}}
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5
task:
    model:
        class: DEnsembleModel
        module_path: qlib.contrib.model.double_ensemble
        kwargs:
            base_model: "gbm"
            loss: mse
            num_models: 3
            enable_sr: True
            enable_fs: True
            alpha1: 1
            alpha2: 1
            bins_sr: 10
            bins_fs: 5
            decay: 0.5
            sample_ratios:
                - 0.8
                - 0.7
                - 0.6
                - 0.5
                - 0.4
            sub_weights:
                - 1
                - 1
                - 1
            epochs: 28
            colsample_bytree: 0.8879
            learning_rate: 0.2
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 20
            verbosity: -1
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [{{START_DATE}}, {{TRAIN_END}}]
                valid: [{{TRAIN_END}}, {{TEST_START}}]
                test: [{{TEST_START}}, {{END_DATE}}]
    record: 
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            config: *port_analysis_config
